name: CI do MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PYTHONIOENCODING: utf-8
      E2E_BROWSER: chrome

    steps:
      - name: Obter o código do evento
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Verificar formatação do frontend
        working-directory: frontend
        run: npm run format:check

      - name: Executar testes Angular e exigir os limites de coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Compilar Angular para produção
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements.lock

      - name: Instalar PostgreSQL 17 para o banco temporário
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
          test -x /usr/lib/postgresql/17/bin/initdb
          test -x /usr/lib/postgresql/17/bin/pg_ctl

      - name: Instalar Chrome e dependências do navegador
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Executar backend, migrações, concorrência e fluxo completo no navegador
        working-directory: backend
        run: >-
          python -B -m pytest -c pyproject.toml tests -q -s -W error
          -p no:cacheprovider --maxfail=1 --tb=short
          --basetemp "${{ runner.temp }}/pytest-mvp"
          --postgres-bin /usr/lib/postgresql/17/bin
          --frontend-e2e
          --junitxml "${{ runner.temp }}/relatorios/backend.xml"

      - name: Salvar o build de produção
        uses: actions/upload-artifact@v7
        with:
          name: build-angular-${{ github.sha }}
          path: frontend/dist/frontend/browser/
          if-no-files-found: error
          retention-days: 7

      - name: Salvar relatórios e capturas dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-testes-${{ github.sha }}
          path: |
            frontend/coverage/frontend/
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/relatorios/backend.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Registrar commit e resultado para a evidência acadêmica
        if: ${{ !cancelled() }}
        env:
          PIPELINE_STATUS: ${{ job.status }}
          PIPELINE_EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          status = os.environ['PIPELINE_STATUS']
          lines = [
              '## Evidência da execução',
              '',
              f'- Commit efetivamente verificado: `{sha}`',
              f'- Evento: `{os.environ["PIPELINE_EVENT"]}`',
              f'- Resultado das etapas anteriores: **{status}**',
              '- Build: Angular 22 em configuração de produção.',
              '- Verificações: formatação, testes Angular, coverage, Pytest e fluxo Playwright.',
              '- Banco: PostgreSQL 17 temporário, sem credenciais do Supabase.',
              '- Storage externo não faz parte desta execução.',
          ]
          coverage = Path('frontend/coverage/frontend/coverage-summary.json')
          if coverage.is_file():
              total = json.loads(coverage.read_text(encoding='utf-8'))['total']
              lines += ['', '### Coverage Angular', '']
              for key in ('lines', 'functions', 'statements', 'branches'):
                  lines.append(f'- {key}: {total[key]["pct"]}%')
          if status == 'success':
              lines += [
                  '',
                  '### Legenda da imagem',
                  '',
                  f'Configurei o pipeline de integração contínua do meu projeto no GitHub Actions. '
                  f'A execução verificou automaticamente o commit {sha}, compilou o frontend '
                  'Angular 22 para produção e executou a verificação de formatação, os testes '
                  'Angular com coverage e os testes do backend FastAPI. O fluxo completo foi '
                  'testado com Playwright e PostgreSQL 17 temporário. Todas essas etapas '
                  'foram concluídas com sucesso, e o build e os relatórios foram disponibilizados '
                  'como artefatos da execução.',
              ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
